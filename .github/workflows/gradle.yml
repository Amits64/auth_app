
name: Java CI with Gradle, SonarCloud & Aikido

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build, Analyze & Publish
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Gradle caching
      - name: Cache Gradle artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 4. Build, tests and SonarCloud Quality Gate
      - name: Build, Test & SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail

          : "${SONAR_TOKEN:?Missing SONAR_TOKEN}"
          : "${SONAR_ORGANIZATION:?Missing SONAR_ORGANIZATION}"
          : "${SONAR_PROJECT_KEY:?Missing SONAR_PROJECT_KEY}"

          ./gradlew clean build sonarqube \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            --no-daemon

      # 5. Install Aikido CI client
      - name: Set up Node.js for Aikido
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Aikido CI client
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: npm install --global @aikidosec/ci-api-client

      # 6. Aikido PR security gate
      - name: Aikido PR Security Gate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          AIKIDO_CLIENT_API_KEY: ${{ secrets.AIKIDO_CLIENT_API_KEY }}
          AIKIDO_REPOSITORY: ${{ github.event.repository.name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          : "${AIKIDO_CLIENT_API_KEY:?Missing AIKIDO_CLIENT_API_KEY}"

          aikido-api-client scan \
            "$AIKIDO_REPOSITORY" \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            --apikey "$AIKIDO_CLIENT_API_KEY" \
            --minimum-severity-level HIGH \
            --fail-on-sast-scan \
            --fail-on-iac-scan \
            --fail-on-secrets-scan

      # 7. Aikido release security gate
      - name: Aikido Release Security Gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AIKIDO_CLIENT_API_KEY: ${{ secrets.AIKIDO_CLIENT_API_KEY }}
          AIKIDO_REPOSITORY: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${AIKIDO_CLIENT_API_KEY:?Missing AIKIDO_CLIENT_API_KEY}"

          aikido-api-client scan-release \
            "$AIKIDO_REPOSITORY" \
            "$COMMIT_SHA" \
            --apikey "$AIKIDO_CLIENT_API_KEY" \
            --minimum-severity-level HIGH \
            --fail-on-sast-scan \
            --fail-on-iac-scan \
            --fail-on-secrets-scan

      # 8. Docker Hub login - main branch only
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 9. Publish only after both quality gates pass
      - name: Build & push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            amits64/auth_app:v${{ github.run_number }}
            amits64/auth_app:latest
